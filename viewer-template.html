<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Apartment geometry viewer</title><style>body{margin:0;background:#f5f4ef;color:#243a42;font:16px system-ui}header{padding:18px 24px;background:white}button,label{margin-right:18px}canvas{width:100%;height:75vh;touch-action:none}aside{padding:10px 24px}a{color:#286f76}</style><header><b id="title"></b><p>PROVISIONAL geometry. Drag to rotate; scroll to zoom. Both views use the same model.</p><button id="reset">Reset view</button><label><input id="walls" type="checkbox">Full-height walls</label><a href="plan.svg">2D plan</a> · <a href="model.obj">3D OBJ</a> · <a href="validation.json">Validation</a></header><canvas id="c"></canvas><aside>Brown lines: door leaves. Blue line: glazing aperture (operation unknown). Furniture is a dimensioned envelope, not a product photograph.</aside><script>
const scene=__SCENE__,canvas=document.getElementById('c'),ctx=canvas.getContext('2d');document.getElementById('title').textContent='Layout '+scene.layout.id+' — deterministic 3D';let yaw=-.35,pitch=.9,scale=95,drag=null;
function project(p){let [x,y,z]=p;x-=2;y-=2.42;let X=x*Math.cos(yaw)-y*Math.sin(yaw),Y=x*Math.sin(yaw)+y*Math.cos(yaw);return [canvas.width/2+X*scale,canvas.height/2+Y*Math.sin(pitch)*scale-z*Math.cos(pitch)*scale,Y*Math.cos(pitch)+z*Math.sin(pitch)]}
function poly(ps,color,stroke='#716f65'){ctx.beginPath();ps.forEach((p,i)=>{let q=project(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=.8;ctx.stroke()}
function draw(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight;ctx.clearRect(0,0,canvas.width,canvas.height);let d=scene.architecture.dimensions,w=d.width.value,h=d.length.value,n=d.notch_x.value,t=d.notch_y.value;poly([[0,0,0],[w,0,0],[w,h,0],[n,h,0],[n,t,0],[0,t,0]],'#bda17e');let faces=[];for(let m of scene.meshes){let vs=m.vertices.map(p=>m.kind==='wall'&&!document.getElementById('walls').checked?[p[0],p[1],Math.min(p[2],.22)]:p);for(let f of m.faces){let ps=f.map(i=>vs[i]);faces.push({ps,color:m.color,z:ps.reduce((s,p)=>s+project(p)[2],0)/ps.length})}}faces.sort((a,b)=>a.z-b.z).forEach(f=>poly(f.ps,f.color));let g=scene.architecture.glazing;ctx.beginPath();let a=project([g.x_start,h,.03]),b=project([g.x_end,h,.03]);ctx.moveTo(...a.slice(0,2));ctx.lineTo(...b.slice(0,2));ctx.strokeStyle='#258ab6';ctx.lineWidth=5;ctx.stroke();let sf=scene.layout.furniture.find(f=>f.id==='sofa');let directions={north:[0,-.45],south:[0,.45],east:[.45,0],west:[-.45,0]},v=directions[scene.layout.sofa_facing],p=[sf.x+sf.width/2,sf.y+sf.depth/2,sf.height+.02],q=[p[0]+v[0],p[1]+v[1],p[2]];let A=project(p),B=project(q);ctx.strokeStyle='#243a42';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();ctx.fillStyle='#243a42';ctx.font='13px system-ui';ctx.fillText('faces TV',B[0],B[1]-5)}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=null;canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(.25,Math.min(1.5,pitch+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY];draw()};canvas.onwheel=e=>{e.preventDefault();scale=Math.max(35,Math.min(220,scale*Math.exp(-e.deltaY*.001)));draw()};document.getElementById('walls').onchange=draw;document.getElementById('reset').onclick=()=>{yaw=-.35;pitch=.9;scale=95;draw()};window.onresize=draw;draw();
</script></html>
